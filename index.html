<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بصيرة</title>
<meta name="description" content="بصيرة — منصة الذكاء الأمني. هذا هو الرابط الثابت الذي يفتح الموقع الحيّ.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0c'/%3E%3Cpath d='M32 18c10 0 18 6.5 22 14-4 7.5-12 14-22 14S14 39.5 10 32c4-7.5 12-14 22-14zm0 6a8 8 0 100 16 8 8 0 000-16z' fill='%23f5f5f5'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0b0c; --fg:#f4f4f5; --muted:#8b8b93;
    --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.035);
    --accent:#e8e8ea;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"SF Arabic","Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:28px;
  }
  .wrap{width:100%; max-width:420px; text-align:center}
  .mark{
    width:64px;height:64px;margin:0 auto 22px;border-radius:18px;
    border:1px solid var(--line); background:var(--card);
    display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:30px;height:30px;display:block}
  h1{font-size:30px;letter-spacing:.2px;margin:0 0 8px;font-weight:650}
  p.sub{margin:0 0 26px;color:var(--muted);font-size:14.5px;line-height:1.75}
  .card{
    border:1px solid var(--line); background:var(--card); border-radius:16px;
    padding:18px 16px; text-align:right;
  }
  .row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
  .row + .row{margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#6b6b73;flex:0 0 8px;transition:background .25s}
  .dot.on{background:#3ddc84}
  .dot.off{background:#e0554d}
  .dot.busy{background:#d8b23c}
  .u{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;direction:ltr;text-align:left;
     font-size:11.5px;color:#a7a7b0;word-break:break-all;margin-top:12px;
     border-top:1px solid var(--line);padding-top:12px;min-height:34px}
  a.go{
    display:block;margin-top:18px;text-decoration:none;
    background:var(--fg);color:#0b0b0c;font-weight:650;font-size:15px;
    padding:14px 18px;border-radius:12px;
  }
  a.go[aria-disabled="true"]{opacity:.45;pointer-events:none}
  .foot{margin-top:20px;color:#5f5f67;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 14c12 0 21.5 8 26 18-4.5 10-14 18-26 18S10.5 42 6 32c4.5-10 14-18 26-18zm0 8a10 10 0 100 20 10 10 0 000-20zm0 5.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9z" fill="#f4f4f5"/>
    </svg>
  </div>

  <h1>بصيرة</h1>
  <p class="sub">هذا هو الرابط الثابت. بمجرد فتحه يتم توصيلك بالموقع الحيّ تلقائيًا.</p>

  <div class="card">
    <div class="row"><span class="dot busy" id="d1"></span><span id="t1">جارٍ فحص الاتصال…</span></div>
    <div class="u" id="u">—</div>
    <a class="go" id="go" href="#" aria-disabled="true">افتح بصيرة</a>
    <div id="gwrap" hidden style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div style="color:var(--muted);font-size:12.5px;margin-bottom:10px;text-align:center">
        أو ادخل بحساب Google مباشرة — بدون كلمة مرور
      </div>
      <div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>
      <div id="gmsg" style="color:#e0554d;font-size:12px;margin-top:8px;text-align:center"></div>
    </div>
  </div>

  <div class="foot">
    إن لم يفتح الموقع من أول محاولة، اضغط «افتح بصيرة» مرة أخرى بعد ثوانٍ.
  </div>
</div>

<script>
(function () {
  // أحدث عنوان أولًا. يحدّثها المشغّل تلقائيًا كلما تغيّر النفق.
  var CANDIDATES = [
      "https://sometimes-with-cindy-pod.trycloudflare.com",
      "https://guitars-months-throat-flower.trycloudflare.com",
      "https://returned-improvements-representatives-premiere.trycloudflare.com",
      "https://rec-jake-supplemental-villages.trycloudflare.com",
      "https://raise-routers-pepper-atlanta.trycloudflare.com"
];
  // معرّف عميل Google — يُملأ تلقائياً من إعدادات الخادم.
  var GOOGLE_CLIENT_ID = "";

  var d1 = document.getElementById('d1'),
      t1 = document.getElementById('t1'),
      u  = document.getElementById('u'),
      go = document.getElementById('go');

  function set(state, text) {
    d1.className = 'dot ' + state;
    t1.textContent = text;
  }

  function probe(base) {
    var url = base.replace(/\/+$/, '') + '/api/site/config';
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
    var opt = { mode: 'no-cors', cache: 'no-store', redirect: 'follow' };
    if (ctl) opt.signal = ctl.signal;
    return fetch(url, opt).then(function () { clearTimeout(timer); return true; },
                               function () { clearTimeout(timer); return false; });
  }

  function arm(base) {
    u.textContent = base;
    go.setAttribute('href', base);
    go.setAttribute('aria-disabled', 'false');
  }

  // يرجّع أول عنوان حيّ — يُستخدم للتحويل بعد دخول Google
  function firstLive() {
    var i = 0;
    return new Promise(function (resolve) {
      (function step() {
        if (i >= CANDIDATES.length) { resolve(null); return; }
        var base = CANDIDATES[i++];
        probe(base).then(function (ok) { ok ? resolve(base) : step(); });
      })();
    });
  }

  function run(i) {
    if (i >= CANDIDATES.length) {
      set('off', 'الموقع غير متاح حاليًا — أعد المحاولة بعد قليل.');
      u.textContent = CANDIDATES[0] || '—';
      return;
    }
    set('busy', 'جارٍ فحص الاتصال…');
    probe(CANDIDATES[i]).then(function (ok) {
      if (ok) {
        set('on', 'تم الاتصال — جارٍ الفتح…');
        arm(CANDIDATES[i]);
        setTimeout(function () { location.replace(CANDIDATES[i]); }, 700);
      } else {
        run(i + 1);
      }
    });
  }

  run(0);

  // ── دخول Google من أصل ثابت (github.io) ثم تمرير الهوية للموقع الحيّ ──
  // سبب وجوده: زر Google يعمل فقط من أصل مسجّل في Google Cloud، وعنوان
  // النفق يتغيّر؛ لذا نتعلّم الهوية هنا ونمرّرها للموقع عبر الـfragment.
  if (!GOOGLE_CLIENT_ID) return;
  document.getElementById('gwrap').hidden = false;

  function fail(msg) {
    document.getElementById('gmsg').textContent = msg || '';
  }

  function onCredential(resp) {
    var cred = resp && resp.credential;
    if (!cred) { fail('لم يُرجِع Google هوية — أعد المحاولة'); return; }
    fail('');
    set('busy', 'جارٍ التوصيل بالموقع…');
    firstLive().then(function (base) {
      if (!base) {
        set('off', 'الموقع غير متاح حاليًا — أعد المحاولة بعد قليل.');
        fail('الخادم الحيّ غير متاح دلوقتي.');
        return;
      }
      location.replace(base.replace(/\/+$/, '') +
        '/#google=' + encodeURIComponent(cred));
    });
  }

  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.onload = function () {
    if (!window.google || !google.accounts) {
      fail('تعذّر تحميل خدمة Google — تحقّق من الاتصال');
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onCredential,
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'), {
      theme: 'filled_black', size: 'large', shape: 'pill',
      text: 'signin_with', locale: 'ar', width: 260,
    });
  };
  s.onerror = function () { fail('تعذّر تحميل خدمة Google'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
